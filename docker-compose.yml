services:
  anatta:
    build: .
    volumes:
      # The whole repo, not just ./agent: git commits from anatta-git-commit
      # need to see .git, which lives at the repo root. Mounting only
      # ./agent leaves /agent/src outside any git repository from the
      # container's point of view, so anatta-git-commit's `git commit`
      # (best-effort, failures unchecked per design) silently no-ops —
      # found via live verification, not caught by ERT (every test uses a
      # throwaway `git init`-ed temp dir, never the real mounted path).
      - .:/repo
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - ANATTA_TASK
    # No published ports — the whole point is a self-modifying process
    # with no path back out to the host beyond this repo checkout.
